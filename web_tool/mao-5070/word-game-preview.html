<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mao VTuber · Xem trước TV</title><style>
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 40%,#dce4d3,#eff0e5 75%);font-family:system-ui;color:#183e34}body{min-height:100vh}.preview-controls{position:relative;z-index:2000;display:flex;gap:8px;justify-content:center;padding:18px}.preview-controls button{border:1px solid #395b71;border-radius:22px;background:#164c3c;color:#e2ebda;padding:9px 20px;cursor:pointer}.preview-controls button[aria-pressed=true]{color:#69e3df;border-color:#69e3df}.preview-note{position:fixed;bottom:15px;left:20px;right:20px;color:#64796c;font-size:12px;text-align:center}.vtv-root{top:83px!important;width:min(1060px,calc(100vw - 40px))!important}@media(max-height:720px){.vtv-root{width:min(880px,calc(100vw - 40px))!important}}
</style></head><body><nav class="preview-controls" aria-label="Trạng thái TV"><button data-phase="idle" aria-pressed="true">TV chờ</button><button data-phase="playing" aria-pressed="false">Đang chơi</button><button data-phase="finished" aria-pressed="false">Kết quả</button></nav><div class="preview-note">Mao VTuber · Xem trước thiết kế TV · Dữ liệu minh họa, không phải vòng chơi trực tiếp</div><script type="module">
import {createWordGameOverlay} from './draco/word-game-overlay.mjs?v=10';
let phase='idle';
function fixture(){const now=Date.now()/1000;return {phase,round_id:'preview',revision:phase,server_now:now,duration:60,ends_at:now+43,show_until:now+300,remaining:43,starter:'Lan',participants:18,category:'Văn hóa Việt',slots:[2,3],letters:['D','Á','I','À','O'],hint_index:1,hints:['Trang phục hay được mặc khi chụp ảnh Tết hoặc dự lễ cưới.','Nhiều nữ sinh mặc bộ màu trắng này đến trường.'],...(phase==='finished'?{answer:'áo dài'}:{}),leaderboard:phase==='finished'?[{nickname:'Người chơi A',score:100,seconds:8.4},{nickname:'Người chơi B',score:100,seconds:12.6},{nickname:'Người chơi C',score:80,seconds:22.1}]:[]};}
window.previewGame=createWordGameOverlay({fetcher:async()=>({ok:true,json:async()=>fixture()})});
for(const button of document.querySelectorAll('.preview-controls button'))button.onclick=()=>{phase=button.dataset.phase;for(const b of document.querySelectorAll('.preview-controls button'))b.setAttribute('aria-pressed',String(b===button));window.previewGame.render(fixture());};
</script></body></html>
