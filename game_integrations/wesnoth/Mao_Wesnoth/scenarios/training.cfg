[multiplayer]
    id=Mao_Wesnoth_Training
    name="Mao: Training Ground"
    description="Local training match. Mao controls side 1 through a bounded action bridge."
    turns=12
    random_start_time=no
    experience_modifier=100
    map_data="border_size=0
usage=map

Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Ch,Ch,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Ch,1 Kh,Ch,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Ch,Ch,Gg,Gg^Vh,Gg,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg^Vh,Gg,Gg,Gg,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Ch,Ch,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Ch,2 Kh,Ch,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Ch,Ch,Gg,Gg
Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg,Gg"
    [side]
        side=1
        controller=ai
        team_name=mao
        user_team_name="Mao"
        type=Lieutenant
        id=Mao_Captain
        name="Mao"
        canrecruit=yes
        recruit=Spearman,Bowman
        gold=60
        income=0
        fog=no
        shroud=no
        [unit]
            type=Spearman
            id=Mao_Scout
            x=4
            y=4
            random_traits=no
        [/unit]
    [/side]
    [side]
        side=2
        controller=ai
        team_name=opponent
        user_team_name="Training opponent"
        type=Orcish Warrior
        id=Training_Leader
        canrecruit=yes
        recruit=Orcish Grunt,Orcish Archer
        gold=30
        income=0
        fog=no
        shroud=no
        [unit]
            type=Orcish Grunt
            id=Training_Grunt
            x=5
            y=4
            random_traits=no
        [/unit]
    [/side]
    [event]
        name=prestart
        [modify_side]
            side=1
            recruit=Spearman,Bowman
        [/modify_side]
        [modify_side]
            side=2
            recruit=Orcish Grunt,Orcish Archer
        [/modify_side]
        [modify_ai]
            side=1
            action=delete
            path=stage[main_loop]
        [/modify_ai]
        [modify_ai]
            side=1
            action=add
            path=stage
            [stage]
                id=mao_loop
                name=ai_default_rca::candidate_action_evaluation_loop
                [candidate_action]
                    id=mao_bridge
                    engine=lua
                    name=mao_bridge
                    max_score=100000
                    location="~add-ons/Mao_Wesnoth/lua/bridge.lua"
                [/candidate_action]
            [/stage]
        [/modify_ai]
    [/event]
    [event]
        name=die
        [filter]
            id=Mao_Captain
        [/filter]
        [lua]
            code=<< wesnoth.dofile("~add-ons/Mao_Wesnoth/lua/bridge.lua").finish("defeat") >>
        [/lua]
    [/event]
    [event]
        name=die
        [filter]
            id=Training_Leader
        [/filter]
        [lua]
            code=<< wesnoth.dofile("~add-ons/Mao_Wesnoth/lua/bridge.lua").finish("victory") >>
        [/lua]
    [/event]
    [event]
        name=time over
        [lua]
            code=<< wesnoth.dofile("~add-ons/Mao_Wesnoth/lua/bridge.lua").finish("turn_limit") >>
        [/lua]
    [/event]
[/multiplayer]
