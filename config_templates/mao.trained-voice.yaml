# Merge under character_config.tts_config. Paths resolve from the repository root.
# Uses the checkpoint from the user-approved Mao-TTS listening preview.
tts_model: vieneu_tts
vieneu_tts:
  mode: v3turbo
  voice: Cold Queen · neutral
  ref_audio: ''
  backend: pytorch
  device: cuda
  precision: fp32
  threads: 4
  temperature: 0.7
  speed: 1.1
  expressive: true
  trained_voice:
    enabled: true
    python_path: ../Mao-TTS/.train-venv/Scripts/python.exe
    model_path: ../Mao-TTS/outputs/cold-queen-emotion-332-20261028/merged
    # Optional absolute local MOSS-Audio-Tokenizer-Nano snapshot when caches differ.
    codec_path: ''
    device: cuda
    emotion_control: false
    timeout: 120
    startup_timeout: 180
  rvc:
    enabled: false
